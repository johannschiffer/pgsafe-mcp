[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pgsafe-mcp"
version = "2.0.1"
description = "Read-only PostgreSQL and SQLite query guard, PII masking, and dry-run mutation MCP server for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Johann Schiffer"}
]
keywords = ["mcp", "model-context-protocol", "postgres", "sqlite", "database", "claude", "cursor", "security", "ai-agent"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]
postgres = ["psycopg[binary]>=3.1.0"]

[project.scripts]
pgsafe-mcp = "pgsafe.server:main"
pgsafe-cli = "pgsafe.cli:main"

[tool.setuptools.packages.find]
include = ["pgsafe*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[project.urls]
Homepage = "https://github.com/johannschiffer/pgsafe-mcp"
Documentation = "https://github.com/johannschiffer/pgsafe-mcp#readme"
Repository = "https://github.com/johannschiffer/pgsafe-mcp"
Issues = "https://github.com/johannschiffer/pgsafe-mcp/issues"
Funding = "https://ko-fi.com/johannschiffer"
