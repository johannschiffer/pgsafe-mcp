services:
  pgsafe:
    build: .
    container_name: genesis-pgsafe
    restart: unless-stopped
    stdin_open: true
    tty: true
    security_opt: ["no-new-privileges:true"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///:memory:}
    volumes:
      - pgsafe_data:/app/data

volumes:
  pgsafe_data:
